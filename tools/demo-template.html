<!doctype html>
<html lang="$html_lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>$title | Lumina Labs</title>
  <link rel="alternate" hreflang="$other_lang" href="$other_url">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Serif:wght@600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
  <link rel="stylesheet" href="${asset_path}/standalone-course-tokens.css">
  <link rel="stylesheet" href="${asset_path}/course-actions.css">
  <link rel="stylesheet" href="${asset_path}/demo.css">
  <script src="${asset_path}/scenarios.js" defer></script>
  <script src="${asset_path}/demo.js" defer></script>
  <script src="${asset_path}/theme.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">$skip</a>
  <header>
    <div class="wrap topbar">
      <a class="brand" href="demos.html">Lumina Labs</a>
      <nav class="controls" aria-label="$controls">
        <a class="lumina-action lumina-action--compact lumina-action--secondary" lang="$other_lang" href="$other_url">$other_label</a>
        <button type="button" class="lumina-action lumina-action--compact lumina-action--secondary" id="theme" aria-pressed="false" hidden>$dark_mode</button>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    <section class="hero" aria-labelledby="title">
      <p class="label">$category</p>
      <h1 id="title">$title</h1>
      <p>$lead</p>
    </section>
    <section class="workbench" aria-label="$experiment">
      <div class="panel">
        <h2>$policy_title</h2>
        <blockquote>$policy</blockquote>
        <form id="gate-form" hidden>
          <fieldset>
            <legend>$choose</legend>
            <label class="choice"><input type="radio" name="days" value="14" checked> $option_14</label>
            <label class="choice"><input type="radio" name="days" value="5"> $option_5</label>
          </fieldset>
          <button class="lumina-action lumina-action--primary" type="submit">$run</button>
        </form>
        <noscript><p>$noscript</p></noscript>
      </div>
      <div class="panel">
        <h2>$result_title</h2>
        <div id="result" class="result" role="status" aria-atomic="true">
          <p id="prompt" hidden>$result_prompt</p>
          <div id="verdict" hidden>
            <div class="result-line"><strong id="decision" class="status"></strong><span id="score" class="score"></span></div>
            <p id="evidence"></p>
          </div>
        </div>
        <aside class="callout note" aria-labelledby="limit-label">
          <strong class="k" id="limit-label">$limit_label</strong>
          <p>$limit</p>
        </aside>
      </div>
    </section>
    <section class="next" aria-labelledby="local-title">
      <h2 id="local-title">$local_title</h2>
      <p>$local_copy</p>
      <pre><code>$command</code></pre>
      <p>$course_next</p>
      <div class="actions">
        <a class="lumina-action lumina-action--secondary" href="$course_url">$course_cta</a>
      </div>
    </section>
  </main>
  <footer><div class="wrap">Lumina Labs · $footer</div></footer>
</body>
</html>
